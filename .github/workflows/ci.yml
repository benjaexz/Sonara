name: Sonara CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sonaradb
          POSTGRES_USER: sonara_user
          POSTGRES_PASSWORD: sonara_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x backend/mvnw

      - name: Run Backend Tests & Package
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sonaradb
          SPRING_DATASOURCE_USERNAME: sonara_user
          SPRING_DATASOURCE_PASSWORD: sonara_password
          JWT_SECRET: c29uYXJhLXN1cGVyLXNlY3JldC1qd3QtdG9rZW4ta2V5LTIwMjY=
        run: ./mvnw clean verify

  deploy:
    name: Continuous Deployment (Render)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Disparando deploy em produção no Render..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy solicitado com sucesso ao Render."
