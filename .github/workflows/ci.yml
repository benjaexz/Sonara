name: Sonara CI Pipeline

on:
push:
branches:
  - main
  - develop
pull_request:
branches:
  - main
  - develop

jobs:
backend-build:
name: Build & Test Backend (Spring Boot)
runs-on: ubuntu-latest
defaults:
  run:
    working-directory: backend
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '21'
      cache: 'maven'

  - name: Give Execution Permission to Maven Wrapper
    run: chmod +x mvnw

  - name: Run Backend Tests & Package
    run: ./mvnw clean test package -DskipTests=false

frontend-build:
name: Build Frontend (Angular)
runs-on: ubuntu-latest
defaults:
  run:
    working-directory: frontend
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: 'npm'
      cache-dependency-path: frontend/package-lock.json

  - name: Install Frontend Dependencies
    run: npm ci

  - name: Build Frontend for Production
    run: npm run build -- --configuration production
