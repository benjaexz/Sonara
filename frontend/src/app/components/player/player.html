@if (currentTrack$ | async; as track) {
<footer class="apple-player">
    <!-- Meta da Faixa (Esquerda) -->
    <div class="player-left">
        <div class="track-artwork">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </div>

        <div class="track-meta">
            <span class="track-title" [title]="track.title">{{ track.title }}</span>
            <span class="track-artist">{{ track.artist.name || 'Artista' }}</span>
        </div>
    </div>

    <!-- Controles Centrais + Scrubbing estilo Apple Music -->
    <div class="player-center">
        <div class="transport-controls">
            <button class="transport-btn" title="Anterior">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <polygon points="19 20 9 12 19 4 19 20"></polygon>
                    <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line>
                </svg>
            </button>

            <button class="play-pill-btn" (click)="togglePlay()"
                [title]="(isPlaying$ | async) ? 'Pausar' : 'Reproduzir'">
                @if (isPlaying$ | async) {
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                    <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                </svg>
                } @else {
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <polygon points="6 4 20 12 6 20 6 4"></polygon>
                </svg>
                }
            </button>

            <button class="transport-btn" title="Próxima">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <polygon points="5 4 15 12 5 20 5 4"></polygon>
                    <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
                </svg>
            </button>
        </div>

        <div class="progress-bar-container">
            <span class="time-stamp">1:04</span>
            <div class="progress-track">
                <div class="progress-fill" [style.width.%]="progress"></div>
            </div>
            <span class="time-stamp">3:42</span>
        </div>
    </div>

    <!-- Controles de Volume (Direita) -->
    <div class="player-right">
        <div class="volume-box">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>

            <input type="range" class="volume-slider" min="0" max="100" [(ngModel)]="volume" />
        </div>
    </div>
</footer>
}
