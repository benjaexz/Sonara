<div class="app-shell" [class.auth-mode]="isAuthRoute()">
    @if (!isAuthRoute()) {
    <aside class="apple-sidebar">
        <div class="brand">
            <div class="brand-badge">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="10 8 16 12 10 16 10 8"></polygon>
                </svg>
            </div>
            <span class="brand-name">Sonara</span>
        </div>

        <nav class="nav-menu">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <span>Músicas</span>
            </a>

            <a routerLink="/playlists" routerLinkActive="active" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <span>Playlists</span>
            </a>

            <a routerLink="/favorites" routerLinkActive="active" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                    </path>
                </svg>
                <span>Favoritos</span>
            </a>

            <a routerLink="/history" routerLinkActive="active" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Histórico</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            @if (currentUser$ | async; as user) {
            <div class="user-profile-row">
                <div class="user-avatar">
                    {{ (user.username || username || 'U').charAt(0).toUpperCase() }}
                </div>
                <div class="user-meta">
                    <span class="user-name" [title]="user.username || username">{{ user.username || username }}</span>
                    <span class="account-status">Conectado</span>
                </div>
                <button class="logout-action-btn" (click)="logout()" title="Encerrar sessão">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
            } @else {
            <div class="auth-toggle">
                <a routerLink="/login" routerLinkActive="active" class="auth-pill-btn">Entrar</a>
                <a routerLink="/register" routerLinkActive="active" class="auth-pill-btn">Cadastrar</a>
            </div>
            }
        </div>
    </aside>
    }

    <main class="main-viewport">
        <router-outlet></router-outlet>
    </main>

    @if (!isAuthRoute()) {
    <app-player></app-player>
    }
</div>
