<div class="app-shell" [class.auth-mode]="isAuthRoute()">
    @if (!isAuthRoute()) {
    <aside class="apple-sidebar">
        <div class="brand">
            <div class="brand-badge">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
                </svg>
            </div>
            <span class="brand-name">Sonara</span>
        </div>

        <nav class="nav-menu">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Músicas</span>
            </a>

            <a routerLink="/playlists" routerLinkActive="active" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <span>Playlists</span>
            </a>

            <a routerLink="/favorites" routerLinkActive="active" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z">
                    </path>
                </svg>
                <span>Favoritos</span>
            </a>

            <a routerLink="/history" routerLinkActive="active" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Histórico</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            @if (currentUser$ | async; as username) {
            <div class="user-profile-row">
                <div class="user-avatar">
                    {{ username.charAt(0).toUpperCase() }}
                </div>
                <div class="user-meta">
                    <span class="user-name" [title]="username">{{ username }}</span>
                    <span class="account-status">Conectado</span>
                </div>
                <button class="logout-action-btn" (click)="logout()" title="Encerrar sessão">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
            } @else {
            <div class="auth-toggle">
                <a routerLink="/login" class="auth-pill-btn">Entrar</a>
                <a routerLink="/register" class="auth-pill-btn active">Registrar</a>
            </div>
            }
        </div>
    </aside>
    }

    <main class="main-viewport">
        <router-outlet></router-outlet>
    </main>

    @if (!isAuthRoute()) {
    <app-player></app-player>
    }
</div>
